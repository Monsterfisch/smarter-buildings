  header: '{{button}}'
  text: '{{button_tooltip}}'
  category:
  - '{{qol}}'
  children:
  - display: GroupBox
    hasHeader: true
    accordion:
      enabled: true
    header: '{{repair_x}}'
    text: '{{repair_x_tooltip}}'
    children:
    - url: smarter-buildings.repair.x
      name: smarter-buildings-repair-x
      text: '{{repair_x}}'
