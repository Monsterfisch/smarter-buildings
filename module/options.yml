options:
- url: smarter-buildings.doors.dynamic
  name: smarter-buildings-doors-dynamic
  display: UCP2Switch
  contents:
    type: boolean
    value: true
  header: '{{dynamic}}'
  text: '{{dynamic_tooltip}}'
  category:
  - '{{bugfixes}}'
- url: smarter-buildings.doors.storage
  name: smarter-buildings-doors-storage
  display: UCP2Switch
  contents:
    type: boolean
    value: true
  header: '{{storage}}'
  text: '{{storage_tooltip}}'
  category:
  - '{{bugfixes}}'
- url: smarter-buildings.doors.unstuck
  name: smarter-buildings-doors-unstuck
  display: UCP2Switch
  contents:
    type: boolean
    value: true
  header: '{{unstuck}}'
  text: '{{unstuck_tooltip}}'
  category:
  - '{{bugfixes}}'
- url: smarter-buildings.repair.fire_blocks
  name: smarter-buildings-repair-fire-blocks
