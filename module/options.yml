  contents:
    type: boolean
    value: false
  header: '{{maces}}'
  text: '{{maces_tooltip}}'
  category:
  - '{{balance_changes}}'
- url: smarter-buildings.stables.breed
  name: smarter-buildings-stables-breed
  display: UCP2Switch
  contents:
    type: boolean
    value: true
  header: '{{breed}}'
  text: '{{breed_tooltip}}'
  category:
  - '{{balance_changes}}'
  children:
  - display: GroupBox
    hasHeader: true
    accordion:
      enabled: true
    header: '{{breed_seconds}}'
    text: '{{breed_seconds_tooltip}}'
    children:
    - url: smarter-buildings.stables.breed_seconds
      name: smarter-buildings-stables-breed-seconds
      text: '{{breed_seconds}}'
      display: Number
      contents:
        type: integer
        value: 0
        min: 0
        max: 3600
        step: 5
  - url: smarter-buildings.stables.slowdown
    name: smarter-buildings-stables-slowdown
    display: UCP2Switch
    contents:
      type: boolean
      value: true
    header: '{{slowdown}}'
    text: '{{slowdown_tooltip}}'
    children:
    - display: GroupBox
      hasHeader: true
      accordion:
        enabled: true
      header: '{{normal_horses}}'
      text: '{{normal_horses_tooltip}}'
      children:
      - url: smarter-buildings.stables.normal_horses
        name: smarter-buildings-stables-normal-horses
        text: '{{normal_horses}}'
        display: Number
        contents:
          type: integer
          value: 4
          min: 1
          max: 100
          step: 1
    - display: GroupBox
      hasHeader: true
      accordion:
        enabled: true
      header: '{{slowdown_factor}}'
      text: '{{slowdown_factor_tooltip}}'
      children:
      - url: smarter-buildings.stables.slowdown_factor
        name: smarter-buildings-stables-slowdown-factor
        text: '{{slowdown_factor}}'
        display: Number
        contents:
          type: integer
          value: 3
          min: 1
          max: 10
          step: 1
    - display: GroupBox
      hasHeader: true
      accordion:
        enabled: true
      header: '{{slowest_seconds}}'
      text: '{{slowest_seconds_tooltip}}'
      children:
      - url: smarter-buildings.stables.slowest_seconds
        name: smarter-buildings-stables-slowest-seconds
        text: '{{slowest_seconds}}'
        display: Number
        contents:
          type: integer
          value: 600
          min: 1
          max: 7200
          step: 30
