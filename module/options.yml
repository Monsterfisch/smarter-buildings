- url: smarter-buildings.firemen.spread
  name: smarter-buildings-firemen-spread
  display: UCP2Switch
  contents:
    type: boolean
    value: true
  header: '{{firemen}}'
  text: '{{firemen_tooltip}}'
  category:
  - '{{bugfixes}}'
  children:
  - display: GroupBox
    hasHeader: true
    accordion:
      enabled: true
    header: '{{firemen_tiles}}'
    text: '{{firemen_tiles_tooltip}}'
    children:
    - url: smarter-buildings.firemen.tiles
      name: smarter-buildings-firemen-tiles
      text: '{{firemen_tiles}}'
      display: Number
      contents:
        type: integer
        value: 20
        min: 1
        max: 200
        step: 1
- url: smarter-buildings.farms.keep_cows
