options:
- display: GroupBox
  category: [Smarter Buildings]
  header: '{{doors_group}}'
  text: '{{doors_group_descr}}'
  hasHeader: true
  children:
  - url: smarter-buildings.doors.dynamic
    name: smarter-buildings-doors-dynamic
    text: '{{dynamic}}'
    tooltip: '{{dynamic_tooltip}}'
    display: Switch
    contents:
      type: boolean
      value: true
  - url: smarter-buildings.doors.storage
    name: smarter-buildings-doors-storage
    text: '{{storage}}'
    tooltip: '{{storage_tooltip}}'
    display: Switch
    contents:
      type: boolean
      value: true
  - url: smarter-buildings.doors.unstuck
    name: smarter-buildings-doors-unstuck
    text: '{{unstuck}}'
    tooltip: '{{unstuck_tooltip}}'
    display: Switch
    contents:
      type: boolean
      value: true

- display: GroupBox
  category: [Smarter Buildings]
  header: '{{repair_group}}'
  text: '{{repair_group_descr}}'
  hasHeader: true
  children:
  - url: smarter-buildings.repair.button
    name: smarter-buildings-repair-button
    text: '{{button}}'
    tooltip: '{{button_tooltip}}'
    display: Switch
    contents:
      type: boolean
      value: true
  - url: smarter-buildings.repair.gold
    name: smarter-buildings-repair-gold
    text: '{{gold}}'
