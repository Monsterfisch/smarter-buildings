dynamic: Перенос дверей
dynamic_tooltip: Заблокированная дверь переносится на свободную сторону.
storage: Перенос дверей складов
storage_tooltip: Амбар и арсенал тоже проверяют доступность входа.
unstuck: Попробовать другую дверь
unstuck_tooltip: Рабочий без маршрута пробует двери по очереди.
button: Кнопка ремонта
button_tooltip: Ремонтируйте свои здания за долю цены, соответствующую урону.
gold: Золото за ремонт
gold_tooltip: На ремонт зданий с ценой в золоте тоже расходуется золото.
fire_blocks: Запрет ремонта при пожаре
fire_blocks_tooltip: Кнопка недоступна до тушения, в том числе на башнях и воротах.
repair_x: Кнопка по горизонтали
repair_x_tooltip: Отступ от левого края панели.
repair_y: Кнопка по вертикали
repair_y_tooltip: Отступ от верхнего края панели.
ai: AI
ai_tooltip: Лорды ИИ проверяют повреждения и могут покупать материалы.
ai_damage: Минимальный урон для ИИ (%)
ai_damage_tooltip: ИИ ремонтирует после потери этой доли здоровья.
ai_interval: Интервал ремонта ИИ (с)
ai_interval_tooltip: Пауза на нормальной скорости. AIC меняет её для отдельного лорда.
ai_minimum_gold: Порог золота для ИИ
ai_minimum_gold_tooltip: ИИ ремонтирует при запасе выше порога. AIC меняет его по лордам.
firemen: Распределять пожарных
firemen_tooltip: Пожарные выбирают очаги, к которым ещё никто не идёт.
firemen_tiles: Штраф за пожарного (клетки)
firemen_tiles_tooltip: Каждый идущий пожарный увеличивает оценку расстояния на это число.
maces: Булавы в новой кузнице
maces_tooltip: Новые кузницы начинают с булав при включении. По умолчанию выключено.
breed: Заменять взятых лошадей
breed_tooltip: Рыцарь освобождает стойло. Отключение возвращает исходные таймер и панель.
stable_panel: Расширенная панель конюшни
stable_panel_tooltip: Показывает всадников и прогресс разведения при включённой замене.
breed_seconds: Базовое время (с)
breed_seconds_tooltip: 0 сохраняет исходное время около 14 секунд.
slowdown: Замедлять при избытке лошадей
slowdown_tooltip: Лошади в стойлах и под рыцарями увеличивают срок после порога.
normal_horses: Порог числа лошадей
normal_horses_tooltip: При 4 пятая живая лошадь выводится медленнее.
slowdown_factor: Множитель времени
slowdown_factor_tooltip: Для каждой лошади сверх порога предыдущий срок умножается на этот коэффициент.
slowest_seconds: Максимум времени (с)
slowest_seconds_tooltip: На обычной скорости разведение не дольше этого.
dairy_scrub: Молочные фермы на редких зарослях
dairy_scrub_tooltip: Редкие заросли считаются подходящей землёй для молочных ферм.
ground_overlay: Отмечать плохую землю
ground_overlay_tooltip: При размещении фермы неподходящие клетки красные.
keep_cows: Сохранять коров
keep_cows_tooltip: Коровы остаются после смерти фермера, пока ферма работает.
hunters_tannery: Охотники забирают туши
hunters_tannery_tooltip: Без оленей охотники берут туши в кожевнях и доставляют мясо.
hunters_chance: Шанс выбрать кожевню (%)
hunters_chance_tooltip: Вероятность зайти в кожевню, пока есть олени.
hunters_carry: Туш за ходку
hunters_carry_tooltip: Столько туш охотник уносит за раз.
hunters_stored: Туш на кожевню
hunters_stored_tooltip: Максимальный запас для охотников.
ai_decorations: Убрать дубли украшений ИИ
ai_decorations_tooltip: ИИ замечает свои флаги, жаровни и колья и удаляет лишние.
balance_changes: Balance Changes
bugfixes: Bugfixes
fixes: Fixes
improvements: Improvements
qol: Quality of Life
