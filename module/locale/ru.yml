dynamic: Двери перемещаются, если их заблокировали
dynamic_tooltip: Дома, часовни, церкви, соборы, трактир, аптека, колодец, чан с водой, рынок, конюшни, гильдии и псарни постоянно проверяют свой вход. Если перед ним что-то построили или клетка стала недоступна, дверь переносится на свободную сторону здания. Раньше использовалась только сторона, выбранная при постройке.
storage: Двери амбара и оружейной тоже перемещаются
storage_tooltip: Амбар и оружейная проверяют свои двери так же, чтобы товары по-прежнему доставлялись, если ворота или стена отрежут прежний вход от мастерских.
unstuck: Застрявшие рабочие пробуют другую дверь
unstuck_tooltip: Когда кто-то выходит из здания и не находит путь к цели — рабочий на склад, в амбар, оружейную или цитадель, мать с детьми к костру, священник, трактирщик или шут на обход — он возвращается внутрь и пробует следующую дверь по часовой стрелке, пока одна не подойдёт. Если ни одна не подходит, дверь остаётся прежней.
button: Кнопка ремонта у каждого повреждённого здания
button_tooltip: |-
  У любого вашего повреждённого здания появляется кнопка ремонта. Ремонт стоит долю цены здания, пропорциональную повреждениям: разрушенное наполовину стоит полцены. При наведении показывается стоимость и наличие ресурсов, как на башнях (требует включённых игровых подсказок).
gold: Ремонт также стоит золото
gold_tooltip: Здания, стоящие золото (например, церкви), также требуют соответствующую долю золота на ремонт. Без этой опции списываются только дерево и камень, как для башен в обычной игре.
fire_blocks: Нельзя ремонтировать горящее здание
fire_blocks_tooltip: |-
  Горящее здание считается таким же препятствием, как враг рядом: кнопка ремонта неактивна, пока огонь не потушен. Действует также для башен и ворот.
repair_x: Положение кнопки по горизонтали
repair_x_tooltip: |-
  Положение кнопки ремонта на панели здания от левого края. Для башен используется 340. Панели со своими кнопками сдвигают её: амбар на 130 влево, трактир на 50, а гильдии инженеров и подкопщиков на 80 вправо; в казарме она по центру прямо под зубцами, в лагере наёмников — по центру снизу.
repair_y: Положение кнопки по вертикали
repair_y_tooltip: Положение кнопки ремонта на панели здания от верхнего края. Для башен используется 466.
ai: ИИ
ai_tooltip: Каждый раз по истечении своего интервала ремонта лорд ИИ просматривает свои здания (включая башни и ворота) и чинит наиболее повреждённое, если у него больше золота, чем минимум, здание не горит и рядом нет врагов. Недостающие дерево и камень он покупает на рынке. Файлы ИИ могут задавать интервал и минимум для каждого лорда через поля AIC BuildingRepairInterval и BuildingRepairMinimumGold (требуется модуль aicloader).
ai_damage: ИИ чинит при повреждениях от (процентов)
ai_damage_tooltip: Лорд ИИ ремонтирует здание только если оно потеряло не менее этого процента прочности.
ai_interval: Интервал ремонта ИИ (секунд)
ai_interval_tooltip: Сколько секунд ждёт лорд ИИ между двумя ремонтами на обычной скорости. Поле AIC BuildingRepairInterval переопределяет значение для отдельного лорда.
ai_minimum_gold: ИИ чинит только при запасе золота выше
ai_minimum_gold_tooltip: Лорд ИИ чинит здания только пока в казне больше этой суммы. Поле AIC BuildingRepairMinimumGold переопределяет значение для отдельного лорда.
firemen: Пожарные распределяются по разным пожарам
firemen_tooltip: Когда горит несколько зданий, пожарный выбирает пожар, к которому ещё не бежит другой пожарный, вместо того чтобы все бежали к одному.
firemen_tiles: Насколько сильно пожарные избегают уже занятого пожара
firemen_tiles_tooltip: Каждый пожарный, уже бегущий к очагу, делает этот пожар для следующего пожарного как бы дальше на указанное число клеток.
maces: Новые кузницы производят булавы
maces_tooltip: Новая кузница сразу начинает делать булавы вместо мечей. Переключить производство по-прежнему можно. По умолчанию отключено.
breed: Конюшни восполняют коней, взятых рыцарями
breed_tooltip: Когда рыцарь берёт коня, конюшня сразу начинает растить нового. Раньше стойло пустовало до гибели этого рыцаря, и одна конюшня обеспечивала лишь четырёх рыцарей. Отключение возвращает исходный таймер и панель конюшни.
stable_panel: Панель конюшни показывает живых коней и следующего коня
stable_panel_tooltip: Число «используется» показывает живых рыцарей на конях этой конюшни, а шкала (как прочность башен) — готовность следующего коня. Когда заняты все четыре стойла, шкала заполнена.
breed_seconds: Время выращивания коня (секунд)
breed_seconds_tooltip: Сколько времени конюшня растит нового коня на обычной скорости, пока живых коней немного. 0 оставляет стандартное время игры (около 14 секунд).
slowdown: Конюшни замедляют выращивание по мере роста числа живых коней
slowdown_tooltip: Живыми конями конюшни считаются кони в стойлах плюс рыцари верхом на её конях. Пока их меньше нормы, конь растится с обычной скоростью; каждый следующий занимает больше времени вплоть до самого медленного — конюшня никогда не останавливается. После гибели рыцарей рост снова ускоряется.
normal_horses: Живых коней до замедления выращивания
normal_horses_tooltip: Сколько коней конюшни может жить до замедления. При 4 первые четыре появляются с обычной скоростью, а пятый уже медленнее.
slowdown_factor: Коэффициент замедления для каждого следующего коня
slowdown_factor_tooltip: Каждый конь сверх нормы растится во столько раз дольше предыдущего. При 3 пятый конь занимает в три раза больше времени, шестой — в девять и т. д.
slowest_seconds: Максимальное время выращивания (секунд)
slowest_seconds_tooltip: |-
  На обычной скорости выращивание никогда не становится медленнее этого значения: конюшня со множеством живых коней продолжает периодически растить новых.
dairy_scrub: Сыроварни можно ставить на редком кустарнике
dairy_scrub_tooltip: Ферме требуется достаточно плодородной земли, и обычно годятся только трава оазиса и густой кустарник. Для сыроварен теперь годится и редкий кустарник. Пшеничные, хмелевые и яблоневые фермы не изменились.
ground_overlay: Фермы подсвечивают непригодную землю красным
ground_overlay_tooltip: При размещении фермы каждая клетка под ней без травы (земля, песок, камни, железо и т. д.) подсвечивается красным, как скалы и постройки, показывая, что мешает установке. Требования к земле не меняются.
keep_cows: Коровы остаются при гибели фермера-сыродела
keep_cows_tooltip: Когда фермер-сыродел погибает, его коровы остаются на ферме вместо исчезновения, так что кожевники могут забирать их, а новый фермер найдёт их на месте. При сносе или остановке фермы коровы по-прежнему исчезают.
hunters_tannery: Охотники забирают туши из кожевен, когда не осталось оленей
hunters_tannery_tooltip: Каждая ошкуренная кожевником корова оставляет тушу у кожевни. Когда на карте нет оленей, свободный охотник идёт к кожевне своего лорда с тушами, несёт их в хижину, разделывает на мясо (как оленя) и относит в амбар.
hunters_chance: Шанс выбора кожевни, пока олени ещё есть (процентов)
hunters_chance_tooltip: Пока на карте есть олени, выходящий охотник с этой вероятностью пойдёт в кожевню с тушами вместо охоты. Без оленей он всегда идёт в кожевню.
hunters_carry: Туш, которые охотник уносит за раз
hunters_carry_tooltip: Сколько туш охотник забирает из кожевни за один поход.
hunters_stored: Туш, хранимых одной кожевней
hunters_stored_tooltip: Максимум туш, которые кожевня хранит для охотников. Следующие коровы туш не оставляют.
ai_decorations: Убрать наслоение флагов, жаровен и голов на пиках у ИИ
ai_decorations_tooltip: ИИ ставит флаги (или головы на пиках) и жаровни на заданные клетки замка и добавляет новые, если не видит их. Раньше он проверял только верхний объект клетки, поэтому флаг цитадели, пыль или ворона заставляли его ставить всё новые и новые копии поверх. Теперь он видит всё на клетке и убирает лишние скопления и висящие в воздухе украшения.
