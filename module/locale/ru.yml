dynamic: Использовать другую дверь, если вход перекрыт
dynamic_tooltip: Рабочие пользуются другой доступной дверью, когда их обычный вход заблокирован.
storage: Переносить также двери амбара и оружейной
storage_tooltip: Разрешает переносить входы амбара и оружейной, если они перекрыты.
unstuck: Перенаправлять рабочих, уже застрявших у двери
unstuck_tooltip: Рабочие, уже застрявшие у перекрытого входа, пробуют другой маршрут.
button: Показывать кнопку «Ремонт» у повреждённых зданий
button_tooltip: Выберите повреждённое здание и нажмите «Ремонт» на его панели. Чтобы узнать стоимость, включите подсказки и наведите курсор на «Ремонт».
gold: Для ремонта нужно и золото
gold_tooltip: Ремонт зданий требует золота вдобавок к обычным материалам.
fire_blocks: Запретить ремонт во время пожара
fire_blocks_tooltip: Огонь на здании должен погаснуть, прежде чем его можно будет починить.
ai: ИИ
ai_tooltip: Лорды ИИ периодически чинят повреждённые здания, если хватает ресурсов.
ai_damage: ИИ чинит при повреждениях от (процентов)
ai_interval: Интервал ремонта ИИ (секунд)
ai_minimum_gold: ИИ чинит только при запасе золота выше
firemen: Распределять пожарных по разным очагам
firemen_tooltip: Пожарные стараются тушить разные пожары отдельно.
maces: Новые кузницы по умолчанию куют булавы
maces_tooltip: Переключить производство можно на обычной панели кузницы.
breed: Восполнять лошадей, взятых рыцарями
breed_tooltip: Конюшни выращивают замену лошадям, которых забрали рыцари.
stable_panel: Показывать лошадей и срок их пополнения
stable_panel_tooltip: Выберите конюшню, чтобы увидеть число лошадей и время до появления следующей.
breed_seconds: Время выращивания коня (секунд)
slowdown: Замедлять разведение, пока живо больше лошадей
slowdown_tooltip: Конюшням требуется больше времени на замену, пока живо больше их лошадей.
normal_horses: Живых коней до замедления выращивания
slowdown_factor: Коэффициент замедления для каждого следующего коня
slowest_seconds: Максимальное время выращивания (секунд)
dairy_scrub: Разрешить молочные фермы на редком кустарнике
dairy_scrub_tooltip: Молочные фермы можно строить на редком кустарнике.
ground_overlay: Показывать непригодную землю для ферм
ground_overlay_tooltip: Предпросмотр размещения отмечает непригодную землю при выборе места для фермы.
keep_cows: Сохранять коров после гибели фермера
keep_cows_tooltip: Коровы выживают после гибели своего фермера.
hunters_tannery: Разрешить охотникам забирать туши из кожевенных мастерских
hunters_tannery_tooltip: Охотники могут охотиться на оленей и забирать туши из кожевенных мастерских.
ai_decorations: Не допускать наложения украшений ИИ
ai_decorations_tooltip: Лорды ИИ ставят украшения только на свободные клетки.
balance_changes: Изменения баланса
bugfixes: Исправления ошибок
fixes: Исправления
improvements: Улучшения
qol: Удобство игры
