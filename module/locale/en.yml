dynamic: Use another door when blocked
dynamic_tooltip: Workers use another accessible door when their usual door is blocked.
storage: Also move granary and armory doors
storage_tooltip: Allow granary and armory entrances to move when blocked.
unstuck: Reroute workers already stuck at a door
unstuck_tooltip: Workers already caught at a blocked entrance try another route.
button: Show Repair on damaged buildings
button_tooltip: Select a damaged building and click Repair on its panel, or hover over Repair with game help on to see the cost.
gold: Repairs also cost gold
gold_tooltip: Building repairs require gold as well as their usual materials.
fire_blocks: Prevent repairs while burning
fire_blocks_tooltip: Let a building’s fire go out before repairing it.
ai: AI
ai_tooltip: AI lords periodically repair damaged buildings when they can afford it.
ai_damage: AI repairs from this much damage (percent)
ai_interval: AI repair interval (seconds)
ai_minimum_gold: AI repairs only with more gold than
firemen: Spread fire brigades across fires
firemen_tooltip: Firefighters try to cover separate fires.
maces: New blacksmiths make maces by default
maces_tooltip: Use the blacksmith’s usual panel to switch production.
breed: Replace horses taken by knights
breed_tooltip: Stables breed replacements for horses taken by knights.
stable_panel: Show horses and the next replacement
stable_panel_tooltip: Select a stable to see its horses and next replacement.
breed_seconds: Time to breed a horse (seconds)
slowdown: Slow breeding as more horses stay alive
slowdown_tooltip: Stables take longer to replace horses while more of their horses survive.
normal_horses: Horses alive before breeding slows down
slowdown_factor: How much slower each further horse comes
slowest_seconds: Slowest breeding time (seconds)
dairy_scrub: Allow dairy farms on thin scrub
dairy_scrub_tooltip: Dairy farms can be placed on thin scrub.
ground_overlay: Show unsuitable farm ground
ground_overlay_tooltip: The placement preview marks unsuitable ground while you position a farm.
keep_cows: Keep cows when their farmer dies
keep_cows_tooltip: Cows survive the loss of their farmer.
hunters_tannery: Let hunters collect carcasses from tanneries
hunters_tannery_tooltip: Hunters can collect stored carcasses from tanneries as well as hunt deer.
ai_decorations: Prevent stacked AI decorations
ai_decorations_tooltip: AI lords place decorations on clear tiles.
