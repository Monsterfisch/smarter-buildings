dynamic: استفاده از درِ دیگر هنگام مسدود بودن
dynamic_tooltip: وقتی درِ معمول کارگران مسدود است، از درِ دسترس‌پذیر دیگری استفاده می‌کنند.
storage: جابه‌جایی درهای انبار غله و اسلحه‌خانه نیز
storage_tooltip: اجازه می‌دهد ورودی‌های انبار غله و اسلحه‌خانه هنگام مسدود بودن جابه‌جا شوند.
unstuck: تغییر مسیر کارگران گیرکرده پشت در
unstuck_tooltip: کارگرانی که از پیش پشت ورودی مسدود گیر افتاده‌اند مسیر دیگری را امتحان می‌کنند.
button: نمایش دکمهٔ تعمیر روی ساختمان‌های آسیب‌دیده
button_tooltip: ساختمان آسیب‌دیده را انتخاب کرده و در پنل آن روی تعمیر کلیک کنید، یا با روشن بودن راهنمای بازی نشانگر را روی تعمیر ببرید تا هزینه را ببینید.
gold: تعمیرها علاوه بر منابع، طلا هم هزینه دارند
gold_tooltip: تعمیر ساختمان‌ها در کنار مصالح معمول به طلا نیز نیاز دارد.
fire_blocks: جلوگیری از تعمیر هنگام آتش‌سوزی
fire_blocks_tooltip: ابتدا باید آتش ساختمان خاموش شود و سپس تعمیر گردد.
ai: هوش مصنوعی
ai_tooltip: لردهای هوش مصنوعی در صورت داشتن توان مالی، ساختمان‌های آسیب‌دیده را به‌طور دوره‌ای تعمیر می‌کنند.
ai_damage: تعمیر هوش مصنوعی از این میزان آسیب به بالا (درصد)
ai_interval: بازهٔ تعمیر هوش مصنوعی (ثانیه)
ai_minimum_gold: تعمیر هوش مصنوعی تنها با طلای بیشتر از
firemen: پخش شدن آتش‌نشان‌ها میان آتش‌های جداگانه
firemen_tooltip: آتش‌نشان‌ها می‌کوشند آتش‌سوزی‌های جداگانه را پوشش دهند.
maces: آهنگری‌های جدید به‌طور پیش‌فرض گرز بسازند
maces_tooltip: برای تغییر تولید، از پنل معمول آهنگری استفاده کنید.
breed: جایگزینی اسب‌های برداشته‌شده توسط شوالیه‌ها
breed_tooltip: اصطبل‌ها برای اسب‌هایی که شوالیه‌ها برمی‌دارند جایگزین پرورش می‌دهند.
stable_panel: نمایش اسب‌ها و جایگزین بعدی
stable_panel_tooltip: یک اصطبل را انتخاب کنید تا اسب‌ها و زمان جایگزین بعدی آن را ببینید.
breed_seconds: زمان پرورش یک اسب (ثانیه)
slowdown: کاهش سرعت پرورش با زنده ماندن اسب‌های بیشتر
slowdown_tooltip: هرچه تعداد بیشتری از اسب‌های اصطبل زنده باشند، جایگزینی اسب زمان بیشتری می‌برد.
normal_horses: تعداد اسب‌های زنده پیش از کند شدن پرورش
slowdown_factor: ضریب کند شدن برای هر اسب اضافی
slowest_seconds: کندترین زمان پرورش (ثانیه)
dairy_scrub: اجازهٔ ساخت مزرعهٔ لبنی روی بوته‌زار تنک
dairy_scrub_tooltip: مزارع لبنی را می‌توان روی زمین با بوته‌زار تنک قرار داد.
ground_overlay: نمایش زمین نامناسب برای مزرعه
ground_overlay_tooltip: پیش‌نمایش ساخت هنگام جاگذاری مزرعه، زمین‌های نامناسب را مشخص می‌کند.
keep_cows: حفظ گاوها پس از مرگ کشاورزشان
keep_cows_tooltip: گاوها با از دست رفتن کشاورز خود زنده می‌مانند.
hunters_tannery: برداشت لاشه از دباغی‌ها توسط شکارچیان
hunters_tannery_tooltip: شکارچیان افزون بر شکار گوزن، می‌توانند لاشه‌های ذخیره‌شده در دباغی‌ها را هم بردارند.
ai_decorations: جلوگیری از روی‌هم‌گذاری تزئینات هوش مصنوعی
ai_decorations_tooltip: لردهای هوش مصنوعی تزئینات را روی کاشی‌های خالی قرار می‌دهند.
balance_changes: تغییرات توازن
bugfixes: رفع خطاها
fixes: اصلاحات
improvements: بهبودها
qol: سهولت استفاده
