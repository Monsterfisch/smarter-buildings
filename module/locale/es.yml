hunters_chance: Probabilidad de ir a la curtiduría (%)
hunters_chance_tooltip: Probabilidad de elegirla mientras queden ciervos.
hunters_carry: Carcasas por viaje
hunters_carry_tooltip: Cantidad que el cazador lleva de una vez.
hunters_stored: Carcasas por curtiduría
hunters_stored_tooltip: Cantidad máxima reservada a los cazadores.
ai_decorations: Evitar adornos de IA apilados
ai_decorations_tooltip: La IA detecta banderas, braseros y picas y elimina duplicados.
