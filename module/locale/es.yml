slowdown_factor: Multiplicador de tiempo
slowdown_factor_tooltip: Cada caballo por encima del umbral multiplica así el tiempo anterior.
slowest_seconds: Tiempo máximo (s)
slowest_seconds_tooltip: A velocidad normal el tiempo de cría no supera este valor.
dairy_scrub: Lecherías en matorral disperso
